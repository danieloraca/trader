[bot]
symbol = "BTC-USD"
base_currency = "BTC"
quote_currency = "USD"
paper_starting_quote_balance = 10000.0

[backtest]
fee_bps = 26
slippage_bps = 5
futures_fee_bps = 5
futures_slippage_bps = 5
futures_stress_fee_bps = 5
futures_stress_slippage_bps = 10
trade_log_csv_path = "data/backtest-trades.csv"

[exchange]
kind = "paper"

[exchange.paper_futures]
leverage = 1.0

[exchange.kraken]
base_url = "https://api.kraken.com"
pair = "XBTUSD"
api_key_env = "KRAKEN_API_KEY"
api_secret_env = "KRAKEN_API_SECRET"
enable_order_placement = false

[market_data]
kind = "replay"
replay_prices = [100.0, 101.0, 102.0, 101.5, 99.0]
idle_sleep_ms = 1000

[market_data.kraken]
base_url = "https://api.kraken.com"
pair = "XBTUSD"
poll_interval_ms = 5000

[risk]
max_order_quote_value = 500.0
max_position_base = 0.25
allow_short = false
max_short_position_base = 0.0

[strategy]
kind = "simple_momentum"

[strategy.simple_momentum]
buy_threshold_bps = 50
sell_threshold_bps = -100
buy_quantity_base = 0.01
sell_quantity_base = 0.005
direction = "long_only"

[strategy.moving_average_crossover]
fast_window = 5
slow_window = 20
quantity_base = 0.001
direction = "long_only"

[strategy.rsi_mean_reversion]
window = 14
oversold_threshold = 30
overbought_threshold = 70
quantity_base = 0.001
direction = "long_only"

[strategy.managed_rsi]
window = 21
oversold_threshold = 30
overbought_threshold = 65
quantity_base = 0.0005
take_profit_bps = 200
stop_loss_bps = 100
max_holding_events = 24
cooldown_events = 1
direction = "long_only"

[strategy.rsi_regime]
window = 21
oversold_threshold = 25
overbought_threshold = 65
regime_window = 120
quantity_base = 0.0005
take_profit_bps = 200
stop_loss_bps = 100
max_holding_events = 24
exit_on_regime_change = true
direction = "long_only"

[strategy.breakout]
window = 20
quantity_base = 0.001
direction = "long_only"

[storage]
sqlite_path = "data/trader.sqlite"

[telemetry]
verbose = true
